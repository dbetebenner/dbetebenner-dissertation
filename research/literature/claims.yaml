# IRTc claim ledger — schema and rules: wiki/methods/claim-ledger-protocol.md (charter §15).
# Source IDs resolve in research/literature/bibliography.bib.
# Seeded at M0 with the founding conjecture, typed per charter §21 task 2.

claims:
  - claim_id: C0001
    claim_text: >-
      If Lord-era IRT had access to Sklar's theorem, copula theory, and modern compute,
      some of IRT might have developed as a dependence-modeling framework in which local
      independence is the independence-copula case rather than the default assumption.
    claim_type: hypothesis
    source_ids: []
    source_quality: user_context
    scope: history
    risk_level: high
    verified_by: null
    verification_date: null
    notes: >-
      The founding conjecture (charter §1, §4). A generator of research questions, never
      evidence. May not be cited as support for any IRTc superiority claim; such claims
      additionally require response scale, margin definition, identifiability conditions,
      estimation procedure, and audited empirical support (charter §4.2).

  - claim_id: C0002
    claim_text: >-
      Sklar's theorem guarantees a unique copula only under continuous marginals; for
      dichotomous/ordinal item responses the linking copula is not unique, so
      continuous-Sklar uniqueness arguments do not transfer to observed item-response data.
    claim_type: established
    source_ids: [S0008-smith-khaled-2012]
    source_quality: peer_reviewed
    scope: theory
    risk_level: medium
    verified_by: null
    verification_date: null
    notes: >-
      Anchors wiki/theory/discrete-copula-cautions.md. Verification pass (WP1 auditor)
      still owed before this appears in any release report; additional primary sources
      (Sklar, Joe, Nelsen, Genest & Nešlehová) to be added during the literature review.

  - claim_id: C0003
    claim_text: >-
      The FactorCopula package's documented PE one-factor example (mle1factor with
      copF1 = joe/joe/rjoe/joe/gum) reproduces on this project's toolchain with
      log-likelihood -151.9777 and the documented dependence-parameter estimates,
      and simulated one-factor Gumbel data (r1factor, n=500, 5 items, 3 categories,
      theta=2) is recovered by mle1factor with max absolute error 0.27.
    claim_type: established
    source_ids: [S0004-factorcopula-cran]
    source_quality: software_docs
    scope: implementation
    risk_level: low
    verified_by: claude-fable-5-m2
    verification_date: 2026-07-31
    notes: >-
      Capability claim only (software docs support capability, never statistical
      truth). Continuously re-verified: the reproduction and recovery run as tests
      in tests/testthat/test-copula-1f.R on every CI push.

  - claim_id: C0004
    claim_text: >-
      With the copula fixed to independence and 2PL marginals, the IRTc
      product-copula wrapper (fit_irtc, marginal ML with 61-point normal
      quadrature) reproduces the mirt 2PL baseline on seeded simulated data
      (n=1000, J=10): log-likelihood within 1e-5, item parameters within 1e-4,
      predicted response probabilities within 1.2e-5. Conventional
      local-independence IRT is the independence-copula special case of IRTc
      by construction (exact equivalence, charter 4.3).
    claim_type: established
    source_ids: []
    source_quality: user_context
    scope: implementation
    risk_level: low
    verified_by: claude-fable-5-level1
    verification_date: 2026-08-01
    notes: >-
      The Level-1 acceptance test (tests/testthat/test-irtc-level1.R),
      re-verified on every CI run. Formal spec:
      wiki/theory/level-1-product-copula-wrapper.md. Scope note: 2PL/binary
      only; Rasch equivalence deliberately not claimed (mirt's Rasch frees the
      latent variance - a different parameterization).

  - claim_id: C0005
    claim_text: >-
      In pre-registered experiment exp_2026_08_02_001 (matrixreasoning, frozen
      80/20 person split, held-out marginal log-loss per response), the
      180-degree-rotated Joe one-factor copula achieved the best held-out score
      (0.369797) versus the 2PL baseline (0.373756) with half the parameters
      (10 vs 20); the gain (0.00396/response) fell below the pre-registered
      acceptance threshold (0.005), so no superiority claim is made. The M3
      suggestive BVN observation did not survive held-out evaluation (0.374969,
      worse than the baseline).
    claim_type: established
    source_ids: []
    source_quality: user_context
    scope: empirical_result
    risk_level: medium
    verified_by: claude-fable-5-m4
    verification_date: 2026-08-02
    notes: >-
      Registered before running (registry commit 97d803f); artifacts at
      experiments/runs/exp_2026_08_02_001/metrics.json with hash-gated data
      integrity. Psychometric reading of rjoe (lower-tail dependence: joint
      incorrect responses among low-ability examinees) is a HYPOTHESIS for
      Level-3 work, not part of this claim.

  - claim_id: C0006
    claim_text: >-
      FactorCopula::mle1factor cannot fit one-factor copula models at realistic
      test lengths: its first stage builds a joint contingency table with
      O(K^J) cells, overflowing R's 2^31 element limit at J=40 and J=50 binary
      items (experiments exp_2026_08_02_002/_003; all six families failed
      identically while 2PL baselines succeeded). J=10 fits work.
    claim_type: established
    source_ids: [S0004-factorcopula-cran]
    source_quality: software_docs
    scope: implementation
    risk_level: low
    verified_by: claude-fable-5-m4
    verification_date: 2026-08-02
    notes: >-
      Capability limitation, reproducible from the registered runs. Motivates
      the native Level-2 one-factor likelihood: irtc already implements the
      per-family conditional h-functions (verified to 1e-6 against mle1factor
      at J=10 in test-heldout.R), so optimization over dependence parameters
      with per-item empirical cutpoints requires no joint table.


  - claim_id: C0007
    claim_text: >-
      irtc's native Level-2 one-factor copula likelihood
      (fit_copula_1f(engine = "irtc"), irtc ff02ee3) removes the C0006
      scalability wall: the person-wise marginal likelihood is assembled
      from per-item copula h-functions with no joint contingency table, and
      fits J=50 (tma) and J=40 (enem19lc_bench10k) in 8-183 seconds per
      family where every FactorCopula fit had failed. At small J it
      reproduces FactorCopula::mle1factor: identical first-stage cutpoints
      (1e-8), log-likelihood within 1e-5, dependence parameters and
      Kendall's taus within 1e-2, for all six supported families.
    claim_type: established
    source_ids: []
    source_quality: user_context
    scope: implementation
    risk_level: low
    verified_by: claude-fable-5-m4
    verification_date: 2026-08-03
    notes: >-
      Reproduction oracle enforced in CI forever
      (test-copula-1f-native.R); scaling demonstrated in registered runs
      exp_2026_08_03_004/_005. C0006 remains true of the wrapped engine;
      this claim is about irtc's own code path.

  - claim_id: C0008
    claim_text: >-
      In pre-registered experiments exp_2026_08_03_004 (tma, 50 items) and
      exp_2026_08_03_005 (enem19lc_bench10k, 40 items) with the native
      Level-2 engine, no one-factor copula family cleared the
      pre-registered acceptance gates. tma: all 7 models converged; the
      2PL baseline achieved the best held-out log-loss (0.523843), with
      the best copula (bvn, 0.524016, half the parameters) trailing by
      0.00017. enem: gum edged the baseline by 0.000217 (0.571430 vs
      0.571647), far below the 0.005 threshold, and rjoe failed to
      converge, violating the zero-convergence-failure criterion. rjoe's
      exp_2026_08_02_001 held-out advantage did not generalize to the
      longer instruments.
    claim_type: established
    source_ids: []
    source_quality: user_context
    scope: empirical_result
    risk_level: medium
    verified_by: claude-fable-5-m4
    verification_date: 2026-08-03
    notes: >-
      Registered before running (registry commit aea2a6d); artifacts at
      experiments/runs/exp_2026_08_03_004/metrics.json and _005/. On short
      instruments exchangeable one-factor copulas with half the parameters
      approximately tie the 2PL held-out; family ranking is
      dataset-dependent. Both readings are Level-3 research inputs, not
      claims of superiority in either direction.
