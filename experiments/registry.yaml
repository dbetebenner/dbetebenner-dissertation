# AMENDMENT 2026-08-02 (append-only): the first execution of
# exp_2026_08_02_001 returned NaN for baseline_2pl_mirt -- a boundary-
# probability bug in irtc::heldout_logloss's 2PL path (extreme item
# discrimination -> plogis exactly 0/1 -> log(0)). Fixed in irtc `323eb20`
# (clamp mirroring the copula path; regression-tested; self-consistency
# oracle unaffected). All three experiments run in full against the fixed
# evaluator; the aborted first execution's artifacts were discarded. The
# frozen eval SCRIPT is unchanged.

# RESULTS NOTE 2026-08-02 (append-only): all three runs executed against the
# fixed evaluator; artifacts in experiments/runs/<run_id>/metrics.json.
# - exp_..._001 (matrixreasoning): all 7 models converged. Best held-out
#   log-loss/response: irtc_1f_rjoe 0.369797 vs baseline_2pl_mirt 0.373756
#   (gain 0.00396 < the pre-registered 0.005) -> NO superiority claim
#   permitted. The M3 suggestive BVN observation did not survive held-out
#   (0.374969, worse than baseline) -- first documented failure case.
# - exp_..._002 (tma, 50 items) and _003 (enem19lc_bench10k, 40 items):
#   baselines fine; ALL FactorCopula fits failed -- the engine builds a
#   joint contingency table (O(2^J) cells), overflowing at J>=40
#   ("table with >= 2^31 elements"). Engine scalability wall, ledgered as
#   C0006; motivates the native Level-2 likelihood (we already own the
#   h-functions via heldout_logloss).

# RESULTS NOTE 2026-08-03 (append-only): exp_2026_08_03_004/_005 executed with
# the v2 evaluator; artifacts in experiments/runs/<run_id>/metrics.json.
# The C0006 engine wall is gone: all 12 native copula fits at J=50/J=40
# completed (8-183s each) where every FactorCopula fit had failed.
# - exp_..._004 (tma, 50 items): all 7 models converged. The 2PL BASELINE
#   achieved the best held-out log-loss (0.523843); the best copula
#   (irtc_native_1f_bvn, 0.524016, half the parameters) trailed by 0.00017.
#   No copula gain -> no claim. BVN's better train AIC (188484.6 vs
#   188554.1) did not survive held-out -- the AIC-vs-held-out divergence
#   pattern from M3/exp_001 repeats.
# - exp_..._005 (enem19lc_bench10k, 40 items): irtc_native_1f_gum edged the
#   baseline by 0.000217 (0.571430 vs 0.571647) -- far below the 0.005
#   gate -- AND irtc_native_1f_rjoe failed to converge, violating the
#   pre-registered zero-convergence-failure criterion. No claim permitted
#   on both grounds; the convergence failure is documented, not hidden.
# - Cross-experiment: rjoe's exp_001 (10-item) held-out advantage did NOT
#   generalize to the longer instruments (worst/failed there). Family
#   ranking is dataset-dependent -- recorded as a Level-3 research input,
#   ledgered as C0008.
